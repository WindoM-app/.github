<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Two repositories: windom, the extension and API; website, the site at windom.app">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16226e"/><stop offset="1" stop-color="#0c1544"/></linearGradient>
    <linearGradient id="sw" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a5b4fc"/></linearGradient>
  </defs>
  <style>
    .h{font:800 44px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#f1f6ff;letter-spacing:-1px}
    .sub{font:600 18px ui-sans-serif,system-ui,sans-serif;fill:#7dd3fc;letter-spacing:1.5px}
    .l{font:500 21px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#b9cdfd}
    .sweep{animation:sw 5s linear infinite}
    @keyframes sw{to{stroke-dashoffset:-1}}
    .dot{animation:p 2.4s ease-in-out infinite}
    @keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.sweep,.dot{animation:none}}
  </style>
  <g>
  <rect x="20" y="40" width="560" height="280" rx="22" fill="url(#bg)" stroke="#7b9ef5" stroke-opacity=".28"/>
  <rect x="20" y="40" width="560" height="280" rx="22" fill="none" stroke="url(#sw)" stroke-width="2.5" pathLength="1" stroke-dasharray=".18 .82" class="sweep" style="animation-delay:0s"/>
  <circle cx="70" cy="92" r="6" fill="#38bdf8" class="dot" style="animation-delay:0s"/>
  <text x="88" y="99" class="sub">PRODUCT</text>
  <text x="54" y="158" class="h">windom</text>
  <text x="54" y="200" class="l">The Chrome extension (web/)</text><text x="54" y="230" class="l">The Fastify + Postgres API (backend/)</text><text x="54" y="260" class="l">One repo, one release, one tag</text>
</g>
  <g>
  <rect x="620" y="40" width="560" height="280" rx="22" fill="url(#bg)" stroke="#7b9ef5" stroke-opacity=".28"/>
  <rect x="620" y="40" width="560" height="280" rx="22" fill="none" stroke="url(#sw)" stroke-width="2.5" pathLength="1" stroke-dasharray=".18 .82" class="sweep" style="animation-delay:1.2s"/>
  <circle cx="670" cy="92" r="6" fill="#38bdf8" class="dot" style="animation-delay:1.2s"/>
  <text x="688" y="99" class="sub">WINDOM.APP</text>
  <text x="654" y="158" class="h">website</text>
  <text x="654" y="200" class="l">Landing page, guide, local setup</text><text x="654" y="230" class="l">Legal pages, English and Hebrew</text><text x="654" y="260" class="l">Prerendered, deployed to GitHub Pages</text>
</g>
</svg>